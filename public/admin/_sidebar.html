<script>
(function () {
    // Paint họ tên ngay từ localStorage (tránh flash "Administrator" chờ auth-check)
    try {
        var info = JSON.parse(localStorage.getItem('user_info') || '{}') || {};
        var name = String(info.full_name || '').trim() || String(info.username || '').trim() || 'Administrator';
        var uname = String(info.username || '').trim();
        var nameEl = document.getElementById('userUsername');
        if (nameEl) { nameEl.textContent = name; nameEl.title = name; }
        var fullEl = document.getElementById('userFullName');
        if (fullEl) fullEl.textContent = name;
        var hintEl = document.getElementById('userUsernameHint');
        if (hintEl) hintEl.textContent = uname ? ('@' + uname) : 'Tài khoản';
        var avatar = document.getElementById('userAvatar');
        if (avatar) {
            var words = name.split(/\s+/).filter(Boolean);
            avatar.textContent = words.length >= 2
                ? (words[0].charAt(0) + words[1].charAt(0)).toUpperCase()
                : name.substring(0, 2).toUpperCase();
        }
    } catch (e) {}

    var KEY = 'admin_sidebar_collapsed';
    var root = document.documentElement;

    function isCollapsed() {
        return root.classList.contains('admin-sidebar-collapsed');
    }

    function setCollapsed(on) {
        root.classList.toggle('admin-sidebar-collapsed', on);
        try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
        var btn = document.getElementById('adminSidebarToggle');
        if (btn) {
            btn.setAttribute('aria-expanded', on ? 'false' : 'true');
            btn.title = on ? 'Mở rộng menu' : 'Thu gọn menu';
        }
    }

    function bindToggle() {
        var btn = document.getElementById('adminSidebarToggle');
        if (!btn || btn.dataset.bound === '1') return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            setCollapsed(!isCollapsed());
        });
        setCollapsed(isCollapsed());
    }

    function bindAdminUserMenu() {
        if (window.__adminUserMenuBound) return;
        window.__adminUserMenuBound = true;

        var menuRoot = document.getElementById('adminUserMenu');
        var menuBtn = document.getElementById('adminUserMenuBtn');
        var panel = document.getElementById('adminUserMenuPanel');
        if (!menuRoot || !menuBtn || !panel || menuBtn.dataset.bound === '1') return;
        menuBtn.dataset.bound = '1';

        function closeMenu() {
            panel.classList.add('hidden');
            menuBtn.setAttribute('aria-expanded', 'false');
        }

        menuBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var open = panel.classList.contains('hidden');
            panel.classList.toggle('hidden', !open);
            menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        document.addEventListener('click', function (e) {
            if (!menuRoot.contains(e.target)) closeMenu();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeMenu();
        });
    }

    function init() {
        bindToggle();
        bindAdminUserMenu();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
