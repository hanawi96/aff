<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang bán ads · Vòng dâu tằm by Ánh</title>
    <link rel="icon" type="image/svg+xml" href="../shop/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #3f2e28;
            --muted: #8a7368;
            --cream: #faf6f1;
            --line: #e8ddd3;
            --accent: #9a6b4f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: "Source Sans 3", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(154, 107, 79, 0.12), transparent 55%),
                var(--cream);
        }
        .card {
            width: min(28rem, 100%);
            padding: 1.75rem 1.5rem;
            border: 1px solid var(--line);
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.72);
            text-align: center;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-family: Fraunces, Georgia, serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.55;
        }
        a {
            display: inline-block;
            margin-top: 1.25rem;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        code {
            font-size: 0.85em;
            color: var(--ink);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Trang bán ads</h1>
        <p>
            Mỗi landing là một file HTML trong thư mục <code>/p/</code>.
            Ví dụ mẫu: <code>/p/vong-dau.html</code>
        </p>
        <a href="vong-dau.html">Mở landing mẫu →</a>
    </div>
</body>
</html>
